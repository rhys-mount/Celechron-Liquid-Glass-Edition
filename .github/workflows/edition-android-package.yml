name: Package Liquid Glass Edition for Android

on:
  push:
    tags: ['edition-android-v*']

permissions:
  contents: read

jobs:
  android:
    if: github.repository == 'rhys-mount/Celechron'
    runs-on: ubuntu-24.04
    steps:
      - name: Check Edition signing configuration
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.EDITION_ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.EDITION_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.EDITION_ANDROID_KEY_PASSWORD }}
          KEYSTORE_BASE64: ${{ secrets.EDITION_ANDROID_KEYSTORE_BASE64 }}
          EXPECTED_CERTIFICATE_SHA256: ${{ vars.EDITION_ANDROID_SIGNING_SHA256 }}
        run: |
          if [[ -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ||
                -z "$KEYSTORE_BASE64" || ! "$EXPECTED_CERTIFICATE_SHA256" =~ ^[[:xdigit:]]{64}$ ]]; then
            echo "::error::Configure all four Edition signing secrets and the certificate SHA-256 variable."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify tag source
        run: git merge-base --is-ancestor HEAD origin/liquid-glass
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;28.2.13676358'
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --no-pub --no-fatal-infos
      - run: flutter test --no-pub
      - name: Configure Flutter Gradle plugin repositories
        run: install -D .github/gradle/edition-plugin-repositories.gradle "${GRADLE_USER_HOME:-$HOME/.gradle}/init.d/edition-plugin-repositories.gradle"
      - name: Sign and verify APKs
        shell: bash
        env:
          CELECHRON_RELEASE_SIGNING_REQUIRED: 'true'
          CELECHRON_RELEASE_STORE_PASSWORD: ${{ secrets.EDITION_ANDROID_STORE_PASSWORD }}
          CELECHRON_RELEASE_KEY_ALIAS: ${{ secrets.EDITION_ANDROID_KEY_ALIAS }}
          CELECHRON_RELEASE_KEY_PASSWORD: ${{ secrets.EDITION_ANDROID_KEY_PASSWORD }}
          KEYSTORE_BASE64: ${{ secrets.EDITION_ANDROID_KEYSTORE_BASE64 }}
          EXPECTED_CERTIFICATE_SHA256: ${{ vars.EDITION_ANDROID_SIGNING_SHA256 }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" || ! "$EXPECTED_CERTIFICATE_SHA256" =~ ^[[:xdigit:]]{64}$ ]]; then
            echo "::error::Set the Edition signing secrets and the 64-digit certificate SHA-256 variable."
            exit 1
          fi

          umask 077
          export CELECHRON_RELEASE_STORE_FILE
          CELECHRON_RELEASE_STORE_FILE="$(mktemp "$RUNNER_TEMP/edition-android-keystore.XXXXXX")"
          trap 'rm -f -- "$CELECHRON_RELEASE_STORE_FILE"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$CELECHRON_RELEASE_STORE_FILE"
          unset KEYSTORE_BASE64

          flutter build apk --release --no-pub --split-per-abi

          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            apk="build/app/outputs/flutter-apk/app-$abi-release.apk"
            certificate="$("$apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
            if [[ "$certificate" != "${EXPECTED_CERTIFICATE_SHA256,,}" ]]; then
              echo "::error::$apk has an unexpected Edition signing certificate."
              exit 1
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: celechron-${{ github.ref_name }}
          path: build/app/outputs/flutter-apk/app-*-release.apk
          if-no-files-found: error

  publish-preview:
    if: github.repository == 'rhys-mount/Celechron' && contains(github.ref_name, '-preview.')
    needs: android
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: celechron-${{ github.ref_name }}
          path: apks
      - name: Publish verified Android APKs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          cat > "$RUNNER_TEMP/edition-release-notes.md" <<'EOF'
          Celechron Liquid Glass Edition 的 Android 预发布版。可在 `liquid-glass` 分支查看相同版本的源码与项目说明。

          - Android 9 及以上。大多数手机请选择 `arm64-v8a`。
          - APK 使用 Edition 独立签名。与官方版或早先的开发签名试用包使用不同签名，Android 无法直接覆盖这些安装。
          - 用户已在 Android 真机试用并反馈无明显问题。发布 APK 另行通过自动化测试和签名核验。
          EOF
          gh release create "$tag" \
            apks/app-arm64-v8a-release.apk apks/app-armeabi-v7a-release.apk apks/app-x86_64-release.apk \
            --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease --latest=false \
            --title "Celechron Liquid Glass Edition ${tag#edition-android-v}" \
            --notes-file "$RUNNER_TEMP/edition-release-notes.md"
