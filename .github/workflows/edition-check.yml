name: Check Liquid Glass Edition

on:
  pull_request:
    branches: [liquid-glass]
  push:
    branches: [liquid-glass, 'feat/**', 'codex/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;28.2.13676358'
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --no-pub --no-fatal-infos
      - run: flutter test --no-pub
      - name: Configure Flutter Gradle plugin repositories
        run: install -D .github/gradle/edition-plugin-repositories.gradle "${GRADLE_USER_HOME:-$HOME/.gradle}/init.d/edition-plugin-repositories.gradle"
      - run: flutter build apk --debug --no-pub
