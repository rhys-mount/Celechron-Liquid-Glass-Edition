plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id 'org.jetbrains.compose'
    id 'org.jetbrains.kotlin.plugin.compose' version '2.2.20'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def editionSigning = [
    storePath: System.getenv('CELECHRON_RELEASE_STORE_FILE'),
    storePassword: System.getenv('CELECHRON_RELEASE_STORE_PASSWORD'),
    keyAlias: System.getenv('CELECHRON_RELEASE_KEY_ALIAS'),
    keyPassword: System.getenv('CELECHRON_RELEASE_KEY_PASSWORD'),
]
def editionSigningConfigured = editionSigning.values().every { it?.trim() }
def editionSigningRequested =
    Boolean.parseBoolean(System.getenv('CELECHRON_RELEASE_SIGNING_REQUIRED')) ||
    editionSigning.values().any { it != null }
if (editionSigningRequested && !editionSigningConfigured) {
    throw new GradleException('Edition signing requires a store file, store password, key alias and key password.')
}

android {
    namespace 'xyz.nosig.celechron'
    compileSdkVersion flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        multiDexEnabled true
        applicationId "xyz.nosig.celechron"
        minSdkVersion 28
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        if (editionSigningConfigured) {
            editionRelease {
                storeFile file(editionSigning.storePath)
                storePassword editionSigning.storePassword
                keyAlias editionSigning.keyAlias
                keyPassword editionSigning.keyPassword
            }
        }
    }

    buildTypes {
        release {
            signingConfig = editionSigningConfigured
                ? signingConfigs.editionRelease
                : signingConfigs.debug
        }
    }

    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion = "1.5.15"
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    implementation 'androidx.window:window:1.3.0'
    implementation 'androidx.window:window-java:1.3.0'
    implementation 'androidx.compose.ui:ui:1.7.6'
    implementation 'androidx.compose.material3:material3:1.3.1'
    implementation "androidx.glance:glance:1.1.1"
    implementation "androidx.glance:glance-appwidget:1.1.1"
    implementation "androidx.glance:glance-material3:1.1.1"
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3"

    // For flutter_secure_storage
    implementation 'com.google.errorprone:error_prone_annotations:2.36.0'
    implementation 'com.github.spotbugs:spotbugs-annotations:4.8.6'

    // For preview
    implementation 'androidx.glance:glance-appwidget-preview:1.1.1'
    implementation "androidx.glance:glance-preview:1.1.1"
}
